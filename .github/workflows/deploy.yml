# Deploys Gila Hub (app + private relay) to your free Cloudflare account on every push to main.
# One-time setup — add two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — shown on the Workers & Pages overview page
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read the code; it can't change the repo.
permissions:
  contents: read

# Never run two deploys at once.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.SKIP_DEPLOY != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check secrets
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret — skipping deploy. See README → Deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build & deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
